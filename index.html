<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEGAL 1337</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&family=Raleway:wght@200;400;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #fff;
    color: #111;
    font-family: 'Montserrat', sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  /* ── INTRO 1: TEGAL 1337 ── */
  #intro {
    position: fixed;
    inset: 0;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    animation: introOut 0.6s cubic-bezier(.77,0,.18,1) 3.2s forwards;
  }
  @keyframes introOut {
    0%   { clip-path: inset(0 0 0 0); }
    100% { clip-path: inset(0 0 100% 0); }
  }
  .intro-word {
    font-family: 'Raleway', sans-serif;
    font-weight: 800;
    font-size: clamp(48px, 10vw, 120px);
    letter-spacing: -0.02em;
    color: #111;
    position: relative;
    animation: wordIn 0.5s cubic-bezier(.22,1,.36,1) 0.1s both;
  }
  @keyframes wordIn {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .intro-word::before, .intro-word::after {
    content: attr(data-text);
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
  }
  .intro-word::before {
    color: #111;
    animation: gBefore 3s ease 0.5s forwards;
    clip-path: polygon(0 20%, 100% 20%, 100% 50%, 0 50%);
  }
  .intro-word::after {
    color: #111;
    animation: gAfter 3s ease 0.5s forwards;
    clip-path: polygon(0 55%, 100% 55%, 100% 80%, 0 80%);
  }
  @keyframes gBefore {
    0%,39%  { transform: translateX(0); opacity: 0; }
    40%  { transform: translateX(-8px); opacity: 1; filter: blur(1px); }
    41%  { transform: translateX(6px); } 42%  { opacity: 0; }
    69%  { opacity: 0; } 70%  { transform: translateX(-12px); opacity: 1; }
    71%  { transform: translateX(4px); } 72%  { opacity: 0; }
    89%  { opacity: 0; } 90%  { transform: translateX(-4px); opacity: 1; }
    91%  { opacity: 0; }
  }
  @keyframes gAfter {
    0%,39%  { transform: translateX(0); opacity: 0; }
    40%  { transform: translateX(8px); opacity: 1; filter: blur(1px); }
    41%  { transform: translateX(-6px); } 42%  { opacity: 0; }
    69%  { opacity: 0; } 70%  { transform: translateX(12px); opacity: 1; }
    71%  { transform: translateX(-4px); } 72%  { opacity: 0; }
    89%  { opacity: 0; } 90%  { transform: translateX(4px); opacity: 1; }
    91%  { opacity: 0; }
  }
  .tear { position: absolute; left: 0; right: 0; height: 2px; background: #111; opacity: 0; pointer-events: none; animation: tearAnim 3s ease 0.5s forwards; }
  .tear1 { top: 38%; } .tear2 { top: 63%; }
  @keyframes tearAnim {
    0%,39%  { opacity: 0; transform: scaleX(0); }
    40%  { opacity: 1; transform: scaleX(1); }
    41%  { opacity: 0.3; transform: scaleX(0.5) translateX(20px); }
    42%  { opacity: 0; }
    70%  { opacity: 0; } 70.5%{ opacity: 1; transform: scaleX(0.8); }
    71%  { opacity: 0; }
  }

  /* ── INTRO 2: CONTRIBUTORS ── */
  #intro-contrib {
    position: fixed;
    inset: 0;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    z-index: 90;
    opacity: 0;
    animation: ciIn 0.5s ease 3.5s forwards, ciOut 0.6s cubic-bezier(.77,0,.18,1) 7.0s forwards;
  }
  @keyframes ciIn  { to { opacity: 1; } }
  @keyframes ciOut {
    0%   { clip-path: inset(0 0 0 0); }
    100% { clip-path: inset(0 0 100% 0); }
  }

  .ci-label {
    font-family: 'Raleway', sans-serif;
    font-weight: 800;
    font-size: clamp(32px, 7vw, 80px);
    letter-spacing: 0.08em;
    color: #111;
    opacity: 0;
    position: relative;
    animation: ciLabelIn 0.6s cubic-bezier(.22,1,.36,1) 3.7s forwards;
  }
  .ci-label::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -8px;
    height: 2px; background: #111;
    transform: scaleX(0); transform-origin: left;
    animation: lineIn 0.5s ease 4.2s forwards;
  }
  @keyframes ciLabelIn {
    from { opacity: 0; transform: translateY(22px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes lineIn { to { transform: scaleX(1); } }

  .ci-names {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 20px;
    max-width: 640px;
    padding: 0 28px;
  }
  .ci-names span {
    font-size: clamp(9px, 1.2vw, 13px);
    font-weight: 700;
    letter-spacing: 0.2em;
    color: #bbb;
    text-transform: lowercase;
    opacity: 0;
  }

  /* ── MAIN ── */
  #main {
    position: fixed;
    inset: 0;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: mainIn 0.8s cubic-bezier(.22,1,.36,1) 7.3s forwards;
  }
  @keyframes mainIn {
    from { opacity: 0; transform: scale(0.97); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* contributor strip pinned to top */
  .contrib-strip {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 10px 16px 8px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-content: flex-start;
    gap: 4px 10px;
    border-bottom: 1px solid #f2f2f2;
  }
  .contrib-label {
    width: 100%;
    text-align: center;
    font-size: clamp(6px, 0.75vw, 8px);
    letter-spacing: 0.55em;
    color: #e0e0e0;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 3px;
  }
  .contrib-strip span {
    font-size: clamp(7px, 0.9vw, 10px);
    font-weight: 700;
    letter-spacing: 0.16em;
    color: #ccc;
    text-transform: lowercase;
    opacity: 0;
    transition: color 0.2s;
    cursor: default;
    animation: fadeUp 0.35s ease forwards;
  }
  .contrib-strip span:hover { color: #111; }

  /* center content */
  .tagline {
    font-weight: 300;
    font-size: clamp(9px, 1.1vw, 12px);
    letter-spacing: 0.5em;
    color: #bbb;
    text-transform: uppercase;
    margin-bottom: 32px;
    animation: fadeUp 0.7s ease 7.6s both;
  }

  .logo-wrap {
    position: relative;
    width: clamp(148px, 19vw, 230px);
    height: clamp(148px, 19vw, 230px);
    margin-bottom: 28px;
    animation: logoUp 0.9s cubic-bezier(.22,1,.36,1) 7.5s both;
  }
  @keyframes logoUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .logo-wrap img {
    width: 100%; height: 100%;
    object-fit: contain; display: block;
    animation: idleFloat 5s ease-in-out infinite;
    position: relative; z-index: 1;
  }
  @keyframes idleFloat {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-7px); }
  }
  .ring-svg {
    position: absolute;
    inset: -14px;
    width: calc(100% + 28px);
    height: calc(100% + 28px);
    pointer-events: none; z-index: 2;
  }
  .ring-inner { animation: spin 7s linear infinite; transform-origin: 50% 50%; }
  .ring-outer { animation: spin 12s linear infinite reverse; transform-origin: 50% 50%; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .headline {
    font-family: 'Raleway', sans-serif;
    font-weight: 800;
    font-size: clamp(24px, 4vw, 52px);
    letter-spacing: -0.02em;
    color: #111;
    text-align: center;
    line-height: 1;
    animation: fadeUp 0.7s ease 7.8s both, idleGlitch 10s ease 10s infinite;
    text-decoration: none;
    display: block;
  }
  a.headline:hover { opacity: 0.75; }
  .headline em { font-style: normal; position: relative; display: inline-block; }
  .headline em::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -5px;
    height: 2px; background: #111;
    transform: scaleX(0); transform-origin: left;
    animation: lineIn 0.5s cubic-bezier(.22,1,.36,1) 8.4s forwards;
  }
  @keyframes idleGlitch {
    0%,91%,100% { transform: skewX(0) translateX(0); }
    92% { transform: skewX(-2deg) translateX(-5px); }
    93% { transform: skewX(1.5deg) translateX(5px); }
    94% { transform: skewX(0) translateX(0); }
  }

  .sub {
    font-weight: 400;
    font-size: clamp(9px, 1.1vw, 12px);
    letter-spacing: 0.4em;
    color: #ccc;
    text-transform: uppercase;
    margin-top: 10px;
    animation: fadeUp 0.7s ease 8.0s both;
  }
  .since {
    margin-top: 18px;
    font-weight: 700;
    font-size: clamp(8px, 0.9vw, 11px);
    letter-spacing: 0.6em;
    color: #ddd;
    text-transform: uppercase;
    animation: fadeUp 0.6s ease 8.1s both;
    display: flex; align-items: center; gap: 14px;
  }
  .since::before, .since::after {
    content: ''; display: block;
    width: 32px; height: 1px; background: #e0e0e0;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .strip {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 2px; background: #111;
    transform: scaleX(0); transform-origin: left;
    animation: stripIn 0.7s cubic-bezier(.22,1,.36,1) 8.8s forwards;
  }
  @keyframes stripIn { to { transform: scaleX(1); } }

  .foot-r {
    position: fixed; bottom: 13px; right: 20px;
    font-size: 9px; letter-spacing: 0.35em; color: #ccc; text-transform: uppercase;
    opacity: 0; animation: fadeUp 0.5s ease 9.0s forwards;
  }
  .foot-l {
    position: fixed; bottom: 13px; left: 20px;
    font-size: 9px; letter-spacing: 0.35em; color: #ccc; text-transform: uppercase;
    opacity: 0; animation: fadeUp 0.5s ease 9.1s forwards;
  }
</style>
</head>
<body>

<!-- INTRO 1 -->
<div id="intro">
  <div class="tear tear1"></div>
  <div class="tear tear2"></div>
  <span class="intro-word" data-text="TEGAL 1337">TEGAL 1337</span>
</div>

<!-- INTRO 2: CONTRIBUTORS reveal -->
<div id="intro-contrib">
  <div class="ci-label">CONTRIBUTORS</div>
  <div class="ci-names" id="ciNames"></div>
</div>

<!-- MAIN -->
<div id="main">
  <div class="contrib-strip" id="contribStrip">
    <div class="contrib-label">contributors</div>
  </div>

  <p class="tagline">Cyber Crime Community</p>

  <div class="logo-wrap">
    <img src="/logo.png" alt="TEGAL 1337" id="logo" />
    <svg class="ring-svg" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle class="ring-inner" cx="128" cy="128" r="114"
        stroke="#111" stroke-width="1.5"
        stroke-dasharray="60 300" stroke-linecap="round"/>
      <circle class="ring-outer" cx="128" cy="128" r="124"
        stroke="#ccc" stroke-width="1"
        stroke-dasharray="30 350" stroke-linecap="round"/>
    </svg>
  </div>

  <a class="headline" href="https://t.me/sibertegal" target="_blank">JOIN <em>COMMUNITY</em></a>
  <p class="sub">Tegal 1337 &nbsp;·&nbsp; Est. 2016</p>
  <div class="since">Since 2016</div>
</div>

<div class="strip"></div>
<div class="foot-r">t.me/sibertegal</div>
<div class="foot-l">tegal 1337</div>

<script>
  const members = [
    '@mrdof','@mrbin','@hacktivis','@billy','@xploit',
    '@r00tme','@zerobyte','@nullptr','@d3v1l','@phantom',
    '@voidx','@l33tcode','@netrunner','@shellx','@cypher',
    '@b4ckd00r','@kernel','@rootkit','@b1nary','@hexdump',
    '@p4cketz','@byteflow','@s1gma','@gr4y','@d4rkn3t',
    '@0xd3ad','@sp00f','@cr4ck','@burpz','@w1ldcard'
  ];

  // Intro-2: names pop in one by one after "CONTRIBUTORS" label appears
  const ciNames = document.getElementById('ciNames');
  members.forEach((m, i) => {
    const s = document.createElement('span');
    s.textContent = m;
    s.style.animation = `fadeUp 0.3s ease ${4.3 + i * 0.07}s forwards`;
    ciNames.appendChild(s);
  });

  // Main strip: names fade in after main appears
  const strip = document.getElementById('contribStrip');
  members.forEach((m, i) => {
    const s = document.createElement('span');
    s.textContent = m;
    s.style.animationDelay = `${7.5 + i * 0.05}s`;
    strip.appendChild(s);
  });

  // Logo canvas
  const img = document.getElementById('logo');
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  const src = new Image();
  src.crossOrigin = 'anonymous';
  src.onload = () => {
    c.width = src.width; c.height = src.height;
    ctx.drawImage(src, 0, 0);
    try { img.src = c.toDataURL(); } catch(e) {}
  };
  src.onerror = () => {};
  src.src = img.src;
</script>
</body>
</html>
